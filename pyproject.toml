[project]
name = "invest-ll"
version = "0.1.0"
description = "Motor de backtesting honesto para estrategias de inversion en bolsa y cripto"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "exchange-calendars>=4.6",
    # Solo las usa src/invest_ll/fetch/. El motor no las conoce y hay un test que
    # falla si eso deja de ser cierto (tests/unit/test_engine_isolation.py).
    "ccxt>=4.4",
    "yfinance>=0.2.50",
    # Parquet: el universo de Binance y el de ETFs (fetch/ y quant/). Llegaba de rebote con
    # streamlit; al retirarlo se declara, que es lo que tenia que haber sido desde el principio.
    "pyarrow>=17",
    # LLM como estrategia. Solo lo usa src/invest_ll/decision/; el motor no lo conoce.
    "anthropic>=0.60",
    # Panel: la API que sirve al frontend de web/. Solo lo usa src/invest_ll/api/; el motor no
    # lo conoce (tests/unit/test_dashboard_data.py lo vigila).
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Las claves de Binance que se pegan en el panel van al almacen de credenciales del sistema
    # (en Windows, el Administrador de credenciales), nunca a un fichero. Solo lo usa
    # src/invest_ll/live/credenciales.py; la linea de comandos sigue leyendo solo del entorno.
    "keyring>=25",
    # Precios en vivo de Hyperliquid (panel v3): el WebSocket y su REST publico. Solo los usa
    # src/invest_ll/vivo/red.py (tests/unit/test_no_network_in_suite.py lo vigila).
    "websockets>=13",
    "httpx>=0.27",
    # El conector MCP (invest-ll-mcp): el SDK oficial, por stdio. Solo lo usa src/invest_ll/mcp/.
    "mcp>=2.3.0",
]

[project.scripts]
invest-ll = "invest_ll.cli:main"
invest-ll-fetch = "invest_ll.cli_fetch:main"
invest-ll-panel = "invest_ll.api.launch:main"
invest-ll-compare = "invest_ll.cli.compare:main"
invest-ll-propose = "invest_ll.cli.propose:main"
invest-ll-analyze = "invest_ll.cli.analyze:main"
invest-ll-generate = "invest_ll.cli.generate:main"
invest-ll-execute = "invest_ll.cli.execute:main"
invest-ll-track = "invest_ll.cli.track:main"
invest-ll-alerts = "invest_ll.cli.alerts:main"
invest-ll-portfolio = "invest_ll.cli.portfolio:main"
invest-ll-signal = "invest_ll.cli.signal:main"
invest-ll-triggers = "invest_ll.cli.triggers:main"
invest-ll-chat = "invest_ll.cli.chat:main"
invest-ll-quant = "invest_ll.cli.quant:main"
invest-ll-mcp = "invest_ll.mcp.servidor:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "pyright>=1.1.390",
    "httpx>=0.27",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invest_ll"]

# --- Gates de la constitucion v1.0.0 ---

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "PTH",       # pathlib
    "RET",       # return
]
ignore = [
    "E501",  # gestionado por el formateador
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "perf: pruebas de rendimiento (SC-001), lentas",
    "property: pruebas de invariantes con hypothesis",
    "network: requiere red de verdad; excluido de la suite por defecto",
]
