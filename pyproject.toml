[project]
name = "invest-ll"
version = "0.1.0"
description = "Motor de backtesting honesto para estrategias de inversion en bolsa y cripto"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "exchange-calendars>=4.6",
    # Solo las usa src/invest_ll/fetch/. El motor no las conoce y hay un test que
    # falla si eso deja de ser cierto (tests/unit/test_engine_isolation.py).
    "ccxt>=4.4",
    "yfinance>=0.2.50",
    # Panel interactivo. Solo lo usa src/invest_ll/dashboard/; el motor no lo conoce.
    "streamlit>=1.40",
    "altair>=5.4",
]

[project.scripts]
invest-ll = "invest_ll.cli:main"
invest-ll-fetch = "invest_ll.cli_fetch:main"
invest-ll-panel = "invest_ll.dashboard.launch:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invest_ll"]

# --- Gates de la constitucion v1.0.0 ---

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "PTH",       # pathlib
    "RET",       # return
]
ignore = [
    "E501",  # gestionado por el formateador
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "perf: pruebas de rendimiento (SC-001), lentas",
    "property: pruebas de invariantes con hypothesis",
    "network: requiere red de verdad; excluido de la suite por defecto",
]
